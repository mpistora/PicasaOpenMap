<head>

  <title>Google Map for Picasa Locations</title>
  <!-- <link rel="stylesheet" type="text/css" href="picasa_infowindow.css" /> -->
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    #map_canvas {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 1px solid #979797;
    }
    #errorDiv {
      font-color: black;
      font-family: arial;
      font-size: 12px;
      position: absolute;
      top: 10px;
      left: 5px;
      width: 98%;
      height: 200px;
      overflow-y:auto;
      z-index: 2000; /* [geotag] otherwise hidden below the Leaflet map */
    }
    #searchErrorDiv {
      font-color: black;
      font-family: Arial;
      font-weight: bold;
      font-size: 12pt;
      text-align: center;
      position: absolute;
      bottom: 0px;
      left: 0px;
      right: 0px;
      height: 100px;
      background-color: #ffffff;
      border: 1px #cdcdcd solid;
      z-index: 2000; /* [geotag] otherwise hidden below the Leaflet map */
      cursor: pointer;
    }
    #hiddenDiv {
      position: absolute;
      top: 1px;
      left: 1px;
      width: 1px;
      height: 1px;
    }
    #addMarkerDiv {
      position: absolute;
      top: 12px;
      left: 34px;
    }
    /* [geotag] "add a place" button, placed below the zoom buttons */
    .picasa-addmarker {
      background: #ffffff;
      padding: 3px;
      line-height: 0;
    }
    .picasa-addmarker img {
      cursor: pointer;
    }
/* picasa_infowindow.css file did not load on some computers via the link tag, so we will insert it here */ 
a {
  text-decoration:none;
}
a:link {
  color:#4488ff;
  text-decoration:none;
}
a:visited {
  color:#4488ff;
  text-decoration:none;
}

a img { border: none ; }

.info_window_bottom_image {
  background-color:#ffffff;
  border:1px #cdcdcd solid;
}
.info_window_title {
  /* background-color:#aaaaff;*/  /* default white background for now */
  font-family:Arial;
  font-weight:bold;
  font-size:10pt;
  border-bottom:1px solid #bbbbbb;
  text-align:center;
  white-space:normal;
}
.info_window_close {
  float:right;
  padding-right:6px;
  padding-top:1px;
  border:0;
}
.info_window_footer {
  font-family:Arial;
  font-style:normal;
  font-size:11px;
  font-weight:lighter;
  border-top:1px solid #bbbbbb;
  text-indent:5px;
}
.info_window_footer_button {
  font-family:Arial;
  font-style:normal;
  font-size:11px;
  font-weight:normal;
  margin: 1px;
  padding:1px;
  border:1px solid #bbbbbb;
  text-align:center;
  cursor:pointer;
  width:92%;
  white-space:normal;
}
.info_window_thumb {
  text-align:center;
  vertical-align:middle;
  margin-top:5px;
}
.info_window_controls {
  text-align:center;
  vertical-align:bottom;
  border-top:1px solid #bbbbbb;
}
.info_window_footerblock {
  display:block;
  width:50px;
  height:100%;
}
  </style>
  <!-- <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/webcomponentsjs/2.0.0/webcomponents-bundle.js"></script> -->
  <!-- <script type="text/javascript" src="https://maps.googleapis.com/maps/api/js?client=google-picasa-client&sensor=false&v=3.53"></script> -->
  <!-- [geotag] Diagnostics: collects errors (including script loading errors) and shows
       a status line when picasa.DEBUG = true or when something is missing. -->
  <script type="text/javascript">
    window.__diagErrors = [];
    window.onerror = function (m, u, l) {
      window.__diagErrors.push(m + ' (' + String(u).split('/').pop() + ':' + l + ')');
      return false;
    };
    window.__diagShow = function () {
      try {
        var ok = window.L && window.picasa && window.picasa.toUrlValue && !window.__diagErrors.length;
        var dbg = window.picasa && window.picasa.DEBUG;
        if (dbg && window.picasa.debugShow) window.picasa.debugShow();
        if (ok && !dbg) return;
        var d = document.createElement('div');
        d.id = 'diagDiv';
        d.style.cssText = 'position:absolute;top:0;left:0;right:0;z-index:20000;background:#ffffcc;' +
          'font:11px Consolas,monospace;padding:3px;border-bottom:1px solid #999;';
        var t = 'Diagnostics - IE document mode: ' + document.documentMode +
          ' | Leaflet: ' + (window.L ? window.L.version : 'MISSING') +
          ' | geotag script: ' + (window.picasa && window.picasa.toUrlValue ? 'OK' : 'MISSING') +
          ' | errors: ' + (window.__diagErrors.length ? window.__diagErrors.join(' ; ') : 'none');
        d.innerText = t;
        d.textContent = t;
        document.body.appendChild(d);
      } catch (e) {}
    };
  </script>
  <link rel="stylesheet" href="leaflet.css" />
  <script src="leaflet.js"></script>
  <script type="text/javascript" src="picasa_geopanel_bin_v3.js"></script>
</head>
<body onload="window.__diagShow &amp;&amp; window.__diagShow();">
  <div id="map_canvas"></div>
  <div id="addMarkerDiv"><img id="addMarker" src="addmarker.png" alt="Add a new place for the currently selected photos" ondragstart="return false" onselectstart="return false" onclick="picasa.notifyPicasa('addMarker');"></div>
  <div id="errorDiv" style="display:none">Picasa failed to initialize Google Maps.
    Please make sure that you are connected to the Internet.</div>
  <div id="searchErrorDiv" style="display:none" onclick="document.getElementById('searchErrorDiv').style.display = 'none';">
    <br />Sorry, search failed.<br />Please try a different address.<br /><br />(Click to close)
  </div>
  <div id="hiddenDiv" style="display:none" checksum="-1" markindex="-1" latlng=""></div>
</body>
</html>
